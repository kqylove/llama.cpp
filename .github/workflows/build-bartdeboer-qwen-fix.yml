name: Build bartdeboer's Qwen Fix (Windows CUDA)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-bartdeboer-qwen-fix.yml'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Download bartdeboer's qwen-tools-reasoning-fixes
      run: |
        # Download the fix branch source code
        Invoke-WebRequest -Uri "https://github.com/bartdeboer/llama.cpp/archive/refs/heads/qwen-tools-reasoning-fixes.zip" -OutFile "source.zip"
        Expand-Archive -Path "source.zip" -DestinationPath "."
        Rename-Item -Path "llama.cpp-qwen-tools-reasoning-fixes" -NewName "llama-fix"
      shell: powershell
    
    - name: Configure CMake
      working-directory: llama-fix
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
      shell: cmd
    
    - name: Build
      working-directory: llama-fix
      run: |
        cmake --build build --config Release --parallel
      shell: cmd
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-windows-cuda-qwen-fix
        path: llama-fix/build/bin/Release/llama-server.exe
