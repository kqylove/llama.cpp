name: Build llama-server Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: responses-namespaces
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_BUILD_SERVER=ON
    - name: Build
      run: cmake --build build --config Release --parallel
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-windows
        path: build/bin/Release/llama-server.exe
